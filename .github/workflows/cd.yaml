name: CD
on:
  push:
    branches:
      - master

jobs:
  build:
    name: Build
    runs-on: ubuntu-20.04
    steps:
    - uses: actions/checkout@v2
      with:
        ref: ${{ github.ref }}
    - run: |
        make
        git config user.name github-actions
        git config user.email github-actions@github.com
        git tag -a $(./bin/ccp --version | cut -d' ' -f3) -m $(./bin/ccp --version | cut -d' ' -f3)
        git push --tags
